name: PowerShell 5.1 integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell script parser validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = @()
          Get-ChildItem . -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $syntax = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$syntax)
            if ($syntax.Count -gt 0) {
              $errors += $syntax
              Write-Host "ERROR $($_.FullName)"
              $syntax | ForEach-Object { Write-Host $_ }
            }
          }
          if ($errors.Count -gt 0) { throw "$($errors.Count) PowerShell syntax errors detected" }
          Write-Host 'All PowerShell scripts parsed successfully.'
      - name: Check browser JavaScript syntax
        shell: powershell
        run: |
          if (Get-Command node -ErrorAction SilentlyContinue) {
            node --check Web/app.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check Web/diagnostics.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check Web/lifecycle.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check Web/voice.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node Tests/Voice.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node Tests/UiContract.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Launch environment diagnostics
        shell: powershell
        run: .\Tests\Diagnose-Startup.ps1
      - name: Intelligence engine smoke test
        shell: powershell
        run: .\Tests\Smoke.ps1
      - name: Rename collisions
        shell: powershell
        run: .\Tests\RenameCollision.ps1
      - name: Encrypted and incremental index
        shell: powershell
        run: .\Tests\IndexStore.ps1
      - name: Lifecycle presence rule and runtime files
        shell: powershell
        run: .\Tests\Lifecycle.ps1
      - name: Rename from SnapShackle OCR sidecars
        shell: powershell
        run: .\Tests\SidecarRename.ps1
      - name: Semaphore data source export
        shell: powershell
        run: .\Tests\SemaphoreExport.ps1
      - name: Data folder override and demo walkthrough
        shell: powershell
        run: .\Tests\DataDir.ps1
      - name: CLI/API parity
        shell: powershell
        run: .\Tests\CliParity.ps1
      - name: Studio HTTP.sys integration
        shell: powershell
        run: .\Tests\StudioIntegration.ps1 -Transport HttpListener
      - name: Studio loopback TCP integration
        shell: powershell
        run: .\Tests\StudioIntegration.ps1 -Transport Tcp
      - name: Dynamic port collision recovery
        shell: powershell
        run: .\Tests\StudioIntegration.ps1 -Transport Tcp -SimulateCollision
      - name: Real GUI BAT launcher and Edge rendering
        shell: powershell
        run: .\Tests\BrowserLaunch.ps1
